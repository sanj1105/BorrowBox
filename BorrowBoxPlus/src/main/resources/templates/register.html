<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account - BorrowBox</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<main class="auth-card">
  <a class="auth-brand" th:href="@{/login}">BorrowBox</a>
  <p class="auth-kicker">JOIN YOUR SHARING COMMUNITY</p>
  <h1>Create an account</h1>
  <p class="auth-intro">Make borrowing and lending easier for everyone.</p>
  <div th:replace="~{fragments :: flash}"></div>
  <form th:action="@{/register}" method="post" class="form auth-form">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" autocomplete="name" th:value="${name}" required maxlength="255">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" th:value="${email}" required maxlength="255">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <small>Use at least 8 characters.</small>
    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
    <button class="btn-primary auth-submit" type="submit">Create account</button>
  </form>
  <p class="auth-switch">Already registered? <a th:href="@{/login}">Sign in</a></p>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>List an item - BorrowBox</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<footer th:replace="~{fragments :: footer}"></footer>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1>List an item to lend</h1>
    <p>Listing as <strong th:text="${currentUser != null ? currentUser.name : ''}"></strong></p>

    <form th:action="@{/items}" th:object="${itemForm}" method="post" class="form">
        <label>Name
            <input type="text" th:field="*{name}">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </label>
        <label>Description
            <textarea th:field="*{description}" rows="3"></textarea>
            <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </label>
        <label>Category
            <input type="text" th:field="*{category}" placeholder="e.g. Books, Stationery, Lab Equipment">
            <span class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
        </label>
        <button type="submit">Add item</button>
    </form>
</main>
</body>
</html>
